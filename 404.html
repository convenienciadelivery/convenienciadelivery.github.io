<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecionando…</title>
  <script>
    // GitHub Pages: 404 → volta para a home do projeto (suporta /repo/)
    (function () {
      var path = location.pathname || "/";
      var base = "/";
      if (path.includes("/admin")) {
        base = path.replace(/\/admin(?:\/.*)?$/, "/");
      } else if (/\.html?$/i.test(path)) {
        base = path.replace(/\/[^/]+$/, "/");
      } else {
        var parts = path.split("/").filter(Boolean);
        if (location.hostname.indexOf("github.io") !== -1 && parts.length) {
          base = "/" + parts[0] + "/";
        } else {
          base = path.endsWith("/") ? path : path.replace(/\/[^/]*$/, "/");
        }
      }
      location.replace(base + "index.html");
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./index.html" />
</head>
<body>
  <p><a href="./index.html">Voltar ao cardápio</a></p>
</body>
</html>
